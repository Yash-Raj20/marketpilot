services:
  db:
    image: postgres:16-alpine
    container_name: marketpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: marketpilot_dev
      POSTGRES_DB: marketpilot
    ports:
      - "5432:5432"
    volumes:
      - marketpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpilot -d marketpilot"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  marketpilot_pgdata:
